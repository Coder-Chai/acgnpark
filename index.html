<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>次元公园，欢迎来到ACGNPARK！</title>
    <script>
      // 必须在首次绘制前执行，所以放 head 且不加 defer。key 与 src/stores/theme.ts 保持一致
      ;(function () {
        try {
          var stored = localStorage.getItem('acgnpark:theme')
        } catch (e) {}
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
    <style>
      /*
       * 兜底底色：应用样式表（走 JS 模块加载）到达前浏览器已经开始绘制，
       * 没有这段就会先刷一帧白底。取值与 tokens.css 的 --color-bg 一致。
       */
      html {
        background: #ffffff;
        color-scheme: light;
      }

      html[data-theme='dark'] {
        background: #000000;
        color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
